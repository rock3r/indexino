<svg xmlns="http://www.w3.org/2000/svg" width="980" height="200" viewBox="0 0 980 200" role="img" aria-label="Cold indexing, three independent JVMs">
<style>
text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #1f2328; }
.title { font-size: 16px; font-weight: 650; }
.note { font-size: 12px; fill: #57606a; }
.label { font-size: 13px; }
.value { font-size: 12px; }
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="title" x="16" y="26">Cold indexing, three independent JVMs</text>
<text class="label" x="16" y="66">Spectre :core</text>
<rect x="166" y="50" width="3" height="8" rx="2" fill="#0969da"/>
<rect x="166" y="60" width="3" height="8" rx="2" fill="#2da44e"/>
<rect x="166" y="70" width="3" height="8" rx="2" fill="#bf8700"/>
<text class="value" x="762" y="68">1.4s   1.4s   1.4s</text>
<text class="label" x="16" y="106">Spectre + deps</text>
<rect x="166" y="90" width="3" height="8" rx="2" fill="#0969da"/>
<rect x="166" y="100" width="3" height="8" rx="2" fill="#2da44e"/>
<rect x="166" y="110" width="3" height="8" rx="2" fill="#bf8700"/>
<text class="value" x="762" y="108">1.6s   1.9s   1.8s</text>
<text class="label" x="16" y="146">IntelliJ //:main</text>
<rect x="166" y="130" width="424" height="8" rx="2" fill="#0969da"/>
<rect x="166" y="140" width="584" height="8" rx="2" fill="#2da44e"/>
<rect x="166" y="150" width="563" height="8" rx="2" fill="#bf8700"/>
<text class="value" x="762" y="148">5m 37s   7m 45s   7m 28s</text>
<text class="note" x="16" y="188">Each row has three cold JVMs. Linear scale: IntelliJ is minutes, Spectre is about 1–2 seconds.</text></svg>
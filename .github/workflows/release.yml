name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-gate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Derive release version from tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag must be SemVer-shaped: v<major>.<minor>.<patch>[-prerelease][+metadata]" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          test -f "release/RELEASE_NOTES-${GITHUB_REF_NAME#v}.md"
      - name: Require all release credentials before publication
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD \
            SIGNING_IN_MEMORY_KEY SIGNING_IN_MEMORY_KEY_PASSWORD \
            MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY \
            APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required release credential: $name" >&2
              exit 1
            fi
          done

  publish:
    name: Verify and upload to Maven Central for manual promotion
    needs: [release-gate, native-distributions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run release checks and generate dependency inventory
        run: |
          ./gradlew \
            check \
            verifyMavenPublication \
            verifyShrunkCli \
            generateBundledDependencyInventory \
            -PVERSION_NAME="${{ needs.release-gate.outputs.version }}"
      - name: Upload dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: native-dependency-inventory
          path: build/reports/release/bundled-dependencies.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload complete Maven Central release train
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          ./gradlew \
            publishToMavenCentral \
            -PVERSION_NAME="${{ needs.release-gate.outputs.version }}" \
            -PcentralAutomaticRelease=true

  native-distributions:
    name: Build final native release candidates
    needs: release-gate
    uses: ./.github/workflows/native-distributions.yml
    with:
      version: ${{ needs.release-gate.outputs.version }}
      release: true
    secrets: inherit

  draft-release:
    name: Create draft GitHub release
    needs: [release-gate, publish, native-distributions]
    if: >-
      needs.publish.result == 'success' &&
      needs.native-distributions.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Download native release candidates
        uses: actions/download-artifact@v5
        with:
          pattern: native-*
          path: downloaded-artifacts
      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f \
            \( -name '*.zip' -o -name '*.sha256' -o -name 'bundled-dependencies.txt' \) \
            -exec cp {} release-assets/ \;
          test "$(find release-assets -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          test "$(find release-assets -maxdepth 1 -name '*.sha256' | wc -l)" -eq 3
          test -f release-assets/bundled-dependencies.txt
      - name: Verify final archive checksums and sign release assets
        shell: bash
        env:
          SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cd release-assets
          for archive in *.zip; do
            sha256sum -c "$archive.sha256"
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
            cosign verify-blob "$archive" \
              --bundle "$archive.sigstore.json" \
              --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(--draft --verify-tag --title "Indexino ${{ needs.release-gate.outputs.version }}")
          if [[ "${{ needs.release-gate.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            "${release_args[@]}" \
            --notes-file "release/RELEASE_NOTES-${{ needs.release-gate.outputs.version }}.md"

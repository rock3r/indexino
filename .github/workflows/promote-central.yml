name: Promote Maven Central deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to promote, without a leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Promote one validated deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Promote the unique validated deployment
        env:
          VERSION: ${{ inputs.version }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          version = os.environ["VERSION"]
          if not version.replace(".", "").isdigit() or version.count(".") != 2:
              raise SystemExit("Version must be a release number, not a tag.")
          username = os.environ.get("MAVEN_CENTRAL_USERNAME", "")
          password = os.environ.get("MAVEN_CENTRAL_PASSWORD", "")
          if not username or not password:
              raise SystemExit("Missing Maven Central credentials.")
          token = base64.b64encode(f"{username}:{password}".encode()).decode()
          del os.environ["MAVEN_CENTRAL_USERNAME"]
          del os.environ["MAVEN_CENTRAL_PASSWORD"]
          expected = {
              f"pkg:maven/dev.sebastiano.indexino/{artifact}@{version}"
              for artifact in (
                  "indexino",
                  "indexino-bom",
                  "indexino-model",
                  "indexino-plugin-api",
                  "indexino-selection-context",
                  "indexino-compose-decoration",
                  "indexino-script-host",
              )
          }

          def request(method, path, query=None):
              url = "https://central.sonatype.com" + path
              if query:
                  url += "?" + urllib.parse.urlencode(query)
              call = urllib.request.Request(
                  url,
                  method=method,
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(call, timeout=60) as response:
                      raw = response.read()
                      return response.status, raw
              except urllib.error.HTTPError as error:
                  return error.code, error.read()

          status, raw = request("GET", "/api/v1/publisher/deployments")
          if status != 200:
              print(f"Listing deployments failed with HTTP {status}.")
              raise SystemExit(1)
          body = json.loads(raw)
          deployments = body.get("deployments", body if isinstance(body, list) else None)
          if not isinstance(deployments, list):
              print("Deployment list response had no deployments array.")
              raise SystemExit(1)
          print(f"Deployments returned: {len(deployments)}")
          matches = []
          for deployment in deployments:
              if deployment.get("deploymentState") != "VALIDATED":
                  continue
              deployment_id = deployment["deploymentId"]
              file_status, file_raw = request(
                  "POST",
                  "/api/v1/publisher/deployments/files",
                  {"deploymentId": deployment_id},
              )
              if file_status != 200:
                  print(f"File listing failed for {deployment_id} with HTTP {file_status}.")
                  raise SystemExit(1)
              file_body = json.loads(file_raw)
              names = []

              def collect(node):
                  if isinstance(node, dict):
                      name = node.get("name") or node.get("path") or node.get("relativePath")
                      if isinstance(name, str):
                          names.append(name)
                      for value in node.values():
                          collect(value)
                  elif isinstance(node, list):
                      for value in node:
                          collect(value)

              collect(file_body)
              artifacts = {
                  name.split("/")[-2]
                  for name in names
                  if name.endswith(f"/{version}.pom") or name.endswith(f"-{version}.pom")
              }
              print(deployment_id, f"pom_artifacts={sorted(artifacts)}")
              if artifacts == {purl.rsplit("/", 1)[-1].split("@", 1)[0] for purl in expected}:
                  matches.append(deployment)
          print(f"Validated deployments containing exactly the seven {version} artifacts: {len(matches)}")
          if len(matches) != 1:
              raise SystemExit(1)
          deployment_id = matches[0]["deploymentId"]
          print(f"Publishing deployment {deployment_id}")
          status, _ = request("POST", f"/api/v1/publisher/deployment/{deployment_id}")
          if status not in (200, 204):
              print(f"Publishing deployment failed with HTTP {status}.")
              raise SystemExit(1)
          print(f"Publish request accepted for {deployment_id}")
          PY
